name: Build Multiplatform Executive Center (Windows, Linux, Android, Web)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web-and-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            target: win
            output_name: windows-exe
          - os: ubuntu-latest
            target: linux
            output_name: linux-appimage

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Application
        working-directory: ./frontend
        run: npm run build

      - name: Build Desktop Executable (Windows .exe or Linux AppImage)
        working-directory: ./frontend
        run: |
          if [ "${{ matrix.target }}" = "win" ]; then
            npx electron-builder --win --x64
          else
            npx electron-builder --linux AppImage --x64
          fi
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: frontend/release/*.*
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Build Web
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Setup Capacitor Android
        working-directory: ./frontend
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Upload Web Asset Package for Mobile
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: frontend/dist/
