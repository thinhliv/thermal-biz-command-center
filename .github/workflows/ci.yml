name: CI

# Chay moi push/PR. Day la vong chan that su: truoc khi workflow nay ton tai,
# 193 test backend va toan bo test frontend chi chay tren may cua nguoi viet.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # tests/conftest.py tu dat DATABASE_URL/JWT_SECRET_KEY/... nen khong can .env.
      - name: Run tests
        run: pytest

  # Quyet dinh "SQLite cho dev + Postgres cho prod" chi dang tin neu migration chay duoc
  # tren Postgres that. `pytest` o tren dung SQLite in-memory, nen job nay la vong duy nhat
  # bao ve duong deploy prod (alembic upgrade head).
  migrations-postgres:
    name: Alembic migrations on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thermal
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: thermal_biz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thermal -d thermal_biz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg2://thermal:ci-only-not-a-secret@localhost:5432/thermal_biz
          JWT_SECRET_KEY: ci-only-jwt-secret-key-0123456789abcdef
          AUTO_SEED: 'false'
        run: alembic upgrade head

      - name: Verify schema landed
        env:
          PGPASSWORD: ci-only-not-a-secret
        run: |
          psql -h localhost -U thermal -d thermal_biz -c '\dt'
          tables=$(psql -h localhost -U thermal -d thermal_biz -tAc \
            "select count(*) from information_schema.tables where table_schema='public'")
          echo "so bang trong schema public: $tables"
          test "$tables" -gt 0

  frontend:
    name: Frontend (typecheck, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Assert PWA assets shipped
        run: |
          for f in dist/index.html dist/sw.js dist/manifest.webmanifest dist/favicon.svg \
                   dist/icons/icon-192.png dist/icons/icon-512.png dist/icons/maskable-512.png \
                   dist/icons/apple-touch-icon.png; do
            test -f "$f" || { echo "thieu $f trong dist/"; exit 1; }
          done
          grep -q 'rel="manifest"' dist/index.html || { echo "index.html thieu link manifest"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  # connectors/tests chua bao gio duoc CI chay: job `backend` dat working-directory
  # o backend/ nen pytest khong nhin thay connectors/. Do la ly do hai loi hong ca
  # production (POST sang doctype ERPNext khong ton tai, va hoa don chi tinh phi dich vu
  # chu khong tinh tien dien) lot qua duoc ma test van xanh - vi test chi chay
  # SIMULATION_MODE, khong cham duong that. Job nay la vong bao ve cho duong that.
  connectors:
    name: Connectors (pytest, incl. live paths)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            connectors/thingsboard-to-erpnext/requirements.txt
            connectors/ha-to-invoiceninja/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r connectors/thingsboard-to-erpnext/requirements.txt
          pip install -r connectors/ha-to-invoiceninja/requirements.txt
          # TestClient cua Starlette can httpx; hai connector khong khai no vi prod khong dung.
          pip install "pytest>=8.0.0" "httpx>=0.27.0"

      - name: Run tests
        run: pytest connectors/tests -q
