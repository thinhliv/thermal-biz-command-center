# HUONG A: STACK CONG NGHIEP TOAN DIEN
# ThingsBoard (IIoT) + ERPNext / DB + Grafana + Connector A
#
# Tat ca secret doc tu `.env` o thu muc goc repo. Khoi chay bang:
#   docker compose --env-file .env -f docker/docker-compose.enterprise.yml up -d
# hoac:  ./run.ps1 Enterprise
#
# STACK NAY PHAI CHAY SAU stack ung dung (`./run.ps1 App`). Ly do: connector_a day du lieu
# vao FastAPI qua mang `thermalbiz_shared`, ma mang do do chinh stack ung dung tao ra.
# Neu chay truoc, docker bao "network thermalbiz_shared declared as external, but could
# not be found" - do khong phai loi cua file nay.

services:
  # 1. ThingsBoard Community Edition (IIoT Platform)
  thingsboard:
    image: thingsboard/tb-node:latest
    container_name: enterprise_thingsboard
    restart: unless-stopped
    ports:
      # 8083 chu khong phai 8080: 8080 la API_PORT cua backend tu viet. Trung nhau thi
      # container nao len truoc container kia chet, va nguoi dung chi thay "port is already
      # allocated" ma khong biet vi sao. Gia tri that nam o .env (TB_PORT=8083).
      - "${TB_PORT:-8083}:8080"
      - "${TB_MQTT_PORT:-1883}:1883"        # MQTT
      - "${TB_COAP_PORT:-5683}:5683/udp"    # CoAP
    environment:
      TB_QUEUE_TYPE: in-memory
      SPRING_DATASOURCE_URL: jdbc:postgresql://tb_postgres:5432/${TB_DB_NAME:-thingsboard}
      SPRING_DATASOURCE_USERNAME: ${TB_DB_USER:-tb_user}
      SPRING_DATASOURCE_PASSWORD: ${TB_DB_PASSWORD:?TB_DB_PASSWORD must be set in .env}
    volumes:
      - tb_data:/data
      - tb_logs:/var/log/thingsboard
    depends_on:
      # ThingsBoard chay migration schema luc khoi dong. Neu Postgres chua san sang no
      # chet va restart loop; `service_healthy` de no doi dung luc.
      tb_postgres:
        condition: service_healthy

  tb_postgres:
    image: postgres:15-alpine
    container_name: enterprise_tb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TB_DB_NAME:-thingsboard}
      POSTGRES_USER: ${TB_DB_USER:-tb_user}
      POSTGRES_PASSWORD: ${TB_DB_PASSWORD:?TB_DB_PASSWORD must be set in .env}
    volumes:
      - tb_pg_data:/var/lib/postgresql/data
    ports:
      - "${TB_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TB_DB_USER:-tb_user} -d ${TB_DB_NAME:-thingsboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 2. ERPNext Application & Database
  erpnext:
    image: frappe/erpnext:v15.20.0
    container_name: enterprise_erpnext
    restart: unless-stopped
    ports:
      - "${ERPNEXT_PORT:-8000}:8000"
    environment:
      DB_HOST: erp_database
      DB_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${ERP_DB_ROOT_PASSWORD:?ERP_DB_ROOT_PASSWORD must be set in .env}
      MARIADB_ROOT_PASSWORD: ${ERP_DB_ROOT_PASSWORD:?ERP_DB_ROOT_PASSWORD must be set in .env}
    volumes:
      - erp_sites:/home/frappe/frappe-bench/sites
    depends_on:
      erp_database:
        condition: service_healthy

  erp_database:
    image: mariadb:10.11
    container_name: enterprise_erp_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ERP_DB_ROOT_PASSWORD:?ERP_DB_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${ERP_DB_NAME:-erpnext_db}
      MYSQL_USER: ${ERP_DB_USER:-erp_user}
      MYSQL_PASSWORD: ${ERP_DB_PASSWORD:?ERP_DB_PASSWORD must be set in .env}
    volumes:
      - erp_data:/var/lib/mysql
      # KHONG mount database/init.sql o day nua. File do viet bang cu phap PostgreSQL
      # (TIMESTAMP WITH TIME ZONE, INTERVAL '15 days', SERIAL) nen entrypoint cua MariaDB
      # fail ngay lan dau -> container restart loop mai mai. Schema ERPNext that la do
      # chinh ERPNext/bench tao, khong phai do minh seed tay.
    ports:
      - "${ERP_DB_PORT:-3306}:3306"
    healthcheck:
      # healthcheck.sh co san trong image mariadb chinh chu; --innodb_initialized cho
      # doi toi khi InnoDB xong, tranh "healthy" luc server con dang khoi dong.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 3. Connector A: ThingsBoard Alarm -> ERPNext + telemetry -> backend tu viet
  connector_a:
    build:
      context: ../connectors/thingsboard-to-erpnext
      dockerfile: Dockerfile
    container_name: enterprise_connector_a
    restart: unless-stopped
    environment:
      ERPNEXT_URL: ${ERPNEXT_URL:?ERPNEXT_URL must be set in .env}
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
      # Khoa ThingsBoard dung khi goi webhook VAO connector. Khac voi khoa connector
      # dung de goi LEN backend - mot khoa cho moi chieu, lo mot chieu khong lo chieu kia.
      CONNECTOR_API_KEY: ${CONNECTOR_A_API_KEY:?CONNECTOR_A_API_KEY must be set in .env}
      SIMULATION_MODE: ${CONNECTOR_A_SIMULATION_MODE:-false}
      # ERPNext khong co doctype "Maintenance Request" (do la cua Odoo). Phieu sua chua
      # tai san la `Asset Repair`, va no BAT BUOC `asset` la Link toi Asset that cua ERPNext.
      # Ten asset do nguoi van hanh khai bao o day - KHONG lay tu device_name cua alarm,
      # vi ThingsBoard dat ten tuy y va mot alarm la co the ghi phieu vao tai san cua khach khac.
      DEVICE_ASSET_MAP: ${CONNECTOR_A_DEVICE_ASSET_MAP:-}
      ERPNEXT_COMPANY: ${ERPNEXT_COMPANY:-}
      ERPNEXT_STORE_WAREHOUSE: ${ERPNEXT_STORE_WAREHOUSE:-}
      ERPNEXT_ASSET_REPAIR_NAMING_SERIES: ${ERPNEXT_ASSET_REPAIR_NAMING_SERIES:-ACC-ASR-.YYYY.-}
      REFRIGERANT_ITEM_CODE: ${REFRIGERANT_ITEM_CODE:-R404A-GAS-CYLINDER}
      REFRIGERANT_RESERVE_QTY: ${REFRIGERANT_RESERVE_QTY:-2}
      ALARM_COOLDOWN_SECONDS: ${CONNECTOR_A_COOLDOWN_SECONDS:-300}
      # Cooldown phai song qua restart container: mat no thi mot con bao dang nhay
      # se tao ra mot phieu Asset Repair moi sau moi lan container dung len.
      CONNECTOR_STATE_DIR: /data
    volumes:
      - connector_a_state:/data
    ports:
      - "${CONNECTOR_A_PORT:-8081}:8081"
    networks:
      default:
      thermalbiz_shared:
    healthcheck:
      # python:3.11-slim khong co curl/wget; dung urllib cua chinh no cho chac.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 4. Grafana - dashboard KY THUAT cho to van hanh
  #    (khong phai man hinh BGD; man hinh BGD la app React tu viet, xem README)
  grafana:
    image: grafana/grafana:latest
    container_name: enterprise_grafana
    restart: unless-stopped
    ports:
      # GRAFANA_PORT_A rieng, KHONG dung lai GRAFANA_PORT: stack A bat buoc chay CUNG LUC
      # voi stack ung dung (noi mang external thermalbiz_shared de connector_a goi duoc
      # FastAPI). Hai service cung bind 3000 thi docker bao "port is already allocated".
      - "${GRAFANA_PORT_A:-3003}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_SECURITY_ALLOW_EMBEDDING: ${GRAFANA_ALLOW_EMBEDDING:-false}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      # provisioning/datasources/enterprise.yaml noi suy 6 bien nay TU MOI TRUONG CUA
      # CONTAINER GRAFANA (khong phai tu .env cua host). Thieu bien nao thi Grafana thay
      # bang chuoi rong -> datasource provision ra voi database/user rong va MOI panel deu
      # loi khi query. Vi vay phai forward du ca ten DB va user, khong chi password.
      # Gia tri mac dinh giong het gia tri mac dinh cua service tb_postgres / erp_database
      # ben tren, de Grafana va DB khong bao gio nhin thay hai cai ten khac nhau.
      # KHONG yeu cau NINJA_DB_PASSWORD: stack A khong chay Invoice Ninja. Bat nguoi dung
      # khai secret cua mot dich vu khong ton tai trong stack nay la ly do khien ca stack
      # khong len duoc (`required variable is missing a value`) ma chang lien quan gi toi loi.
      TB_DB_NAME: ${TB_DB_NAME:-thingsboard}
      TB_DB_USER: ${TB_DB_USER:-tb_user}
      TB_DB_PASSWORD: ${TB_DB_PASSWORD:?TB_DB_PASSWORD must be set in .env}
      ERP_DB_NAME: ${ERP_DB_NAME:-erpnext_db}
      ERP_DB_USER: ${ERP_DB_USER:-erp_user}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD:?ERP_DB_PASSWORD must be set in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      # Mount TUNG FILE, khong mount ca thu muc. Neu mount ca thu muc ../grafana/provisioning
      # thi stack nay nap them datasource cua stack B va cua app -> Grafana thu noi toi
      # nhung host khong ton tai trong mang nay, nguoi dung thay mot lo datasource chet.
      - ../grafana/provisioning/datasources/enterprise.yaml:/etc/grafana/provisioning/datasources/enterprise.yaml:ro
      - ../grafana/provisioning/dashboards/enterprise.yaml:/etc/grafana/provisioning/dashboards/enterprise.yaml:ro
      - ../grafana/dashboards/enterprise:/var/lib/grafana/dashboards/enterprise:ro
    depends_on:
      tb_postgres:
        condition: service_healthy
      erp_database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  tb_data:
  tb_logs:
  tb_pg_data:
  erp_data:
  erp_sites:
  grafana_data:
  connector_a_state:

networks:
  default:
    name: thermalbiz_enterprise
  # Mang dung chung voi stack ung dung, de connector_a noi duoc FastAPI (container
  # `thermal_api`). Stack ung dung phai chay truoc de tao mang nay.
  thermalbiz_shared:
    external: true
    name: thermalbiz_shared
