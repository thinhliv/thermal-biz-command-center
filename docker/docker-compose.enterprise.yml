# HUONG A: STACK CONG NGHIEP TOAN DIEN
# ThingsBoard (IIoT) + ERPNext / DB + Grafana + Connector A
#
# Tat ca secret doc tu `.env` o thu muc goc repo. Khoi chay bang:
#   docker compose --env-file .env -f docker/docker-compose.enterprise.yml up -d

services:
  # 1. ThingsBoard Community Edition (IIoT Platform)
  thingsboard:
    image: thingsboard/tb-postgres:latest
    container_name: enterprise_thingsboard
    restart: unless-stopped
    ports:
      - "${TB_PORT:-8080}:8080"
      - "${TB_MQTT_PORT:-1883}:1883"        # MQTT
      - "${TB_COAP_PORT:-5683}:5683/udp"    # CoAP
    environment:
      TB_QUEUE_TYPE: in-memory
      SPRING_DATASOURCE_URL: jdbc:postgresql://tb_postgres:5432/${TB_DB_NAME:-thingsboard}
      SPRING_DATASOURCE_USERNAME: ${TB_DB_USER:-tb_user}
      SPRING_DATASOURCE_PASSWORD: ${TB_DB_PASSWORD:?TB_DB_PASSWORD must be set in .env}
    volumes:
      - tb_data:/data
      - tb_logs:/var/log/thingsboard
    depends_on:
      - tb_postgres

  tb_postgres:
    image: postgres:15-alpine
    container_name: enterprise_tb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TB_DB_NAME:-thingsboard}
      POSTGRES_USER: ${TB_DB_USER:-tb_user}
      POSTGRES_PASSWORD: ${TB_DB_PASSWORD:?TB_DB_PASSWORD must be set in .env}
    volumes:
      - tb_pg_data:/var/lib/postgresql/data
    ports:
      - "${TB_POSTGRES_PORT:-5433}:5432"

  # 2. ERPNext Database / Business Layer View
  erp_database:
    image: mariadb:10.11
    container_name: enterprise_erp_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ERP_DB_ROOT_PASSWORD:?ERP_DB_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${ERP_DB_NAME:-erpnext_db}
      MYSQL_USER: ${ERP_DB_USER:-erp_user}
      MYSQL_PASSWORD: ${ERP_DB_PASSWORD:?ERP_DB_PASSWORD must be set in .env}
    volumes:
      - erp_data:/var/lib/mysql
      # CANH BAO: init.sql hien la cu phap PostgreSQL, se fail tren MariaDB.
      # Se duoc tach thanh database/mariadb/*.sql o Dot 4.
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${ERP_DB_PORT:-3306}:3306"

  # 3. Connector A: ThingsBoard Alarm to ERPNext Maintenance Bridge
  connector_a:
    build:
      context: ../connectors/thingsboard-to-erpnext
      dockerfile: Dockerfile
    container_name: enterprise_connector_a
    restart: unless-stopped
    environment:
      ERPNEXT_URL: ${ERPNEXT_URL:?ERPNEXT_URL must be set in .env}
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
      CONNECTOR_API_KEY: ${CONNECTOR_A_API_KEY:?CONNECTOR_A_API_KEY must be set in .env}
      SIMULATION_MODE: ${CONNECTOR_A_SIMULATION_MODE:-false}
    ports:
      - "${CONNECTOR_A_PORT:-8081}:8081"

  # 4. Grafana Unified Executive Command Center
  grafana:
    image: grafana/grafana:latest
    container_name: enterprise_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_SECURITY_ALLOW_EMBEDDING: ${GRAFANA_ALLOW_EMBEDDING:-false}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      # datasources.yaml noi suy cac bien nay (Grafana ho tro $ENV_VAR trong provisioning)
      TB_DB_PASSWORD: ${TB_DB_PASSWORD:?TB_DB_PASSWORD must be set in .env}
      ERP_DB_PASSWORD: ${ERP_DB_PASSWORD:?ERP_DB_PASSWORD must be set in .env}
      NINJA_DB_PASSWORD: ${NINJA_DB_PASSWORD:?NINJA_DB_PASSWORD must be set in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
      - ../grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - tb_postgres
      - erp_database

volumes:
  tb_data:
  tb_logs:
  tb_pg_data:
  erp_data:
  grafana_data:
