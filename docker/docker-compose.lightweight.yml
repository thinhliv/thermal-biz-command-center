# HUONG B: STACK DICH VU NANG LUONG TINH GON & CHO THUE KHO LANH (ESCO)
# Home Assistant + Invoice Ninja + Twenty CRM + Grafana + Connector B
#
# Tat ca secret doc tu `.env` o thu muc goc repo. Khoi chay bang:
#   docker compose --env-file .env -f docker/docker-compose.lightweight.yml up -d
# hoac:  ./run.ps1 Lightweight
#
# STACK NAY PHAI CHAY SAU stack ung dung (`./run.ps1 App`). Ly do: connector_b day chi so
# cong to vao FastAPI qua mang `thermalbiz_shared`, ma mang do do chinh stack ung dung tao ra.
# Neu chay truoc, docker bao "network thermalbiz_shared declared as external, but could
# not be found" - do khong phai loi cua file nay.

services:
  # 1. Home Assistant Core (Local IoT & Metering)
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: esco_homeassistant
    restart: unless-stopped
    # KHONG dung `privileged: true`. Container nay mo cong 8123 ra may chu; privileged cho
    # phep no thoat ra host, va day la repo cong khai nen ai copy cung ke thua cai do.
    # Neu can doc USB/Zigbee dongle, khai bao dung thiet bi can dung, hep hon nhieu:
    #   devices:
    #     - /dev/ttyUSB0:/dev/ttyUSB0
    # Can mDNS/discovery thi dung `network_mode: host` (luc do bo `ports:` di).
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - hass_config:/config
    ports:
      - "${HASS_PORT:-8123}:8123"

  # 2. Invoice Ninja Database
  ninja_db:
    image: mariadb:10.11
    container_name: esco_ninja_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NINJA_DB_ROOT_PASSWORD:?NINJA_DB_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${NINJA_DB_NAME:-ninja}
      MYSQL_USER: ${NINJA_DB_USER:-ninja}
      MYSQL_PASSWORD: ${NINJA_DB_PASSWORD:?NINJA_DB_PASSWORD must be set in .env}
    volumes:
      - ninja_db_data:/var/lib/mysql
    ports:
      - "${NINJA_DB_PORT:-3307}:3306"
    healthcheck:
      # healthcheck.sh co san trong image mariadb chinh chu; --innodb_initialized cho
      # doi toi khi InnoDB xong, tranh bao "healthy" luc server con dang khoi dong.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 3. Invoice Ninja (Billing & Invoicing Suite)
  invoiceninja:
    image: invoiceninja/invoiceninja:latest
    container_name: esco_invoiceninja
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:${INVOICE_NINJA_PORT:-8088}
      APP_KEY: ${INVOICE_NINJA_APP_KEY:?INVOICE_NINJA_APP_KEY must be set in .env}
      APP_ENV: production
      APP_DEBUG: "false"
      REQUIRE_HTTPS: "false"
      DB_TYPE: mysql
      DB_HOST: ninja_db
      DB_PORT: "3306"
      DB_DATABASE: ${NINJA_DB_NAME:-ninja}
      DB_USERNAME: ${NINJA_DB_USER:-ninja}
      DB_PASSWORD: ${NINJA_DB_PASSWORD:?NINJA_DB_PASSWORD must be set in .env}
    ports:
      - "${INVOICE_NINJA_PORT:-8088}:80"
    depends_on:
      # `service_healthy` o DB: Invoice Ninja chay migration luc khoi dong, MariaDB chua
      # san sang thi migration fail va khong tu chay lai.
      ninja_db:
        condition: service_healthy

  invoiceninja_worker:
    image: invoiceninja/invoiceninja:latest
    container_name: esco_ninja_worker
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    environment:
      APP_URL: http://localhost:${INVOICE_NINJA_PORT:-8088}
      APP_KEY: ${INVOICE_NINJA_APP_KEY:?INVOICE_NINJA_APP_KEY must be set in .env}
      APP_ENV: production
      APP_DEBUG: "false"
      REQUIRE_HTTPS: "false"
      DB_TYPE: mysql
      DB_HOST: ninja_db
      DB_PORT: "3306"
      DB_DATABASE: ${NINJA_DB_NAME:-ninja}
      DB_USERNAME: ${NINJA_DB_USER:-ninja}
      DB_PASSWORD: ${NINJA_DB_PASSWORD:?NINJA_DB_PASSWORD must be set in .env}
    depends_on:
      ninja_db:
        condition: service_healthy

  # 4. Connector B: chi so cong to (HA) -> hoa don dien (backend tu viet + Invoice Ninja)
  connector_b:
    build:
      context: ../connectors/ha-to-invoiceninja
      dockerfile: Dockerfile
    container_name: esco_connector_b
    restart: unless-stopped
    environment:
      HASS_URL: ${HASS_URL:-http://homeassistant:8123}
      # Khong dung :? o day. Token chi co sau khi HA da chay va dang nhap duoc;
      # connector_b se tu fail-fast voi log ro rang neu thieu, thay vi chan ca stack.
      HASS_TOKEN: ${HASS_TOKEN:-}
      INVOICE_NINJA_URL: ${INVOICE_NINJA_URL:-http://invoiceninja:80}
      INVOICE_NINJA_TOKEN: ${INVOICE_NINJA_TOKEN:-}
      # Khoa nguoi goi dung de goi VAO connector. Khac voi khoa connector dung de goi
      # LEN backend - mot khoa cho moi chieu, lo mot chieu khong lo chieu kia.
      CONNECTOR_API_KEY: ${CONNECTOR_B_API_KEY:?CONNECTOR_B_API_KEY must be set in .env}
      SIMULATION_MODE: ${CONNECTOR_B_SIMULATION_MODE:-false}
      TENANT_CLIENT_MAP: ${TENANT_CLIENT_MAP:-{}}
      # Connector KHONG giu bieu gia. Backend tinh delta kWh, chia 3 khung gio EVN va
      # tra ve dong tien that; connector chi dich ket qua do thanh line items cua Invoice Ninja.
      # `thermal_api:8080` la container cua stack ung dung, noi qua mang thermalbiz_shared.
      BACKEND_URL: ${BACKEND_URL:-http://thermal_api:8080}
      # Khoa connector dung de goi LEN backend (chinh la CONNECTOR_API_KEY cua backend).
      BACKEND_CONNECTOR_API_KEY: ${BACKEND_CONNECTOR_API_KEY:-}
      RETRY_BACKOFF_SECONDS: ${CONNECTOR_B_RETRY_BACKOFF_SECONDS:-1.0}
      # Dead-letter queue phai song qua restart container: hoa don da tao ben Invoice Ninja
      # ma chua ghi nhan lai duoc o backend la thu PHAI con de doi soat, khong duoc bay mat.
      CONNECTOR_STATE_DIR: /data
    volumes:
      - connector_b_state:/data
    ports:
      - "${CONNECTOR_B_PORT:-8082}:8082"
    networks:
      default:
      thermalbiz_shared:
    depends_on:
      # Chi `service_started`: connector khong ket noi HA/Invoice Ninja luc khoi dong,
      # chi ket noi khi co yeu cau xuat hoa don. Bat doi `service_healthy` ma khong chac
      # image co san curl/wget de do thi de lam connector khong bao gio duoc chay.
      homeassistant:
        condition: service_started
      invoiceninja:
        condition: service_started
    healthcheck:
      # python:3.11-slim khong co curl/wget; dung urllib cua chinh no cho chac.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 5. Grafana - dashboard KY THUAT cho to van hanh
  #    (khong phai man hinh BGD; man hinh BGD la app React tu viet, xem README)
  grafana:
    image: grafana/grafana:latest
    container_name: esco_grafana
    restart: unless-stopped
    ports:
      # GRAFANA_PORT_B rieng (3001): stack ung dung da giu GRAFANA_PORT (3000) va stack A
      # giu GRAFANA_PORT_A (3003). Ba Grafana co the chay dong thoi tren mot may.
      - "${GRAFANA_PORT_B:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_SECURITY_ALLOW_EMBEDDING: ${GRAFANA_ALLOW_EMBEDDING:-false}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      # provisioning/datasources/lightweight.yaml noi suy 3 bien nay TU MOI TRUONG CUA
      # CONTAINER GRAFANA (khong phai tu .env cua host). Thieu bien nao thi Grafana thay
      # bang chuoi rong -> datasource `invoiceninja_mysql` provision ra voi database/user
      # rong va ca 26 panel cua dashboard esco-billing deu loi khi query.
      # Gia tri mac dinh giong het gia tri mac dinh cua service ninja_db ben tren.
      # KHONG yeu cau TB_DB_PASSWORD / ERP_DB_PASSWORD: stack B khong chay ThingsBoard
      # hay ERPNext. Bat nguoi dung khai secret cua dich vu khong ton tai trong stack nay
      # la ly do khien ca stack khong len duoc ma chang lien quan gi toi loi that.
      NINJA_DB_NAME: ${NINJA_DB_NAME:-ninja}
      NINJA_DB_USER: ${NINJA_DB_USER:-ninja}
      NINJA_DB_PASSWORD: ${NINJA_DB_PASSWORD:?NINJA_DB_PASSWORD must be set in .env}
    volumes:
      - esco_grafana_data:/var/lib/grafana
      # Mount TUNG FILE, khong mount ca thu muc. Neu mount ca thu muc ../grafana/provisioning
      # thi stack nay nap them datasource cua stack A va cua app -> Grafana thu noi toi
      # nhung host khong ton tai trong mang nay, nguoi dung thay mot lo datasource chet.
      - ../grafana/provisioning/datasources/lightweight.yaml:/etc/grafana/provisioning/datasources/lightweight.yaml:ro
      - ../grafana/provisioning/dashboards/lightweight.yaml:/etc/grafana/provisioning/dashboards/lightweight.yaml:ro
      - ../grafana/dashboards/lightweight:/var/lib/grafana/dashboards/lightweight:ro
    depends_on:
      ninja_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 6. Twenty CRM (Lead & Kho Hop Dong ESCO)
  #    Contract lay tu chinh ma nguon twenty-server (`config-variables.ts`) va
  #    `packages/twenty-docker/docker-compose.yml` cua upstream. Ba bien KHONG co
  #    @IsOptional() nen bat buoc phai co, thieu la server tu choi khoi dong:
  #      PG_DATABASE_URL, REDIS_URL, APP_SECRET
  #    Truoc day file nay chi set PG_DATABASE_URL -> container crash-loop vi thieu
  #    APP_SECRET va REDIS_URL, ma log NestJS khong noi ro la thieu bien gi.
  twenty:
    image: twentycrm/twenty:latest
    container_name: esco_twenty
    restart: unless-stopped
    # Migration cua Twenty chay luc khoi dong va co the lau; grace period ngan se
    # kill container giua chung migration (upstream dat 120s).
    stop_grace_period: 120s
    ports:
      - "${TWENTY_PORT:-3002}:3000"
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgresql://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD:?TWENTY_DB_PASSWORD must be set in .env}@twenty_db:5432/${TWENTY_DB_NAME:-twenty}
      SERVER_URL: http://localhost:${TWENTY_PORT:-3002}
      REDIS_URL: redis://twenty_redis:6379
      # Khoa at-rest cho secret luu trong DB; ENCRYPTION_KEY khong set thi fallback ve day.
      APP_SECRET: ${TWENTY_APP_SECRET:?TWENTY_APP_SECRET must be set in .env}
      STORAGE_TYPE: local
      # Migration + cron chi dang ky o server, khong dang ky lai o worker.
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
    volumes:
      # STORAGE_TYPE=local ma khong mount volume thi file dinh kem (hop dong, anh kho)
      # mat het moi lan tao lai container. Server va worker phai dung CHUNG volume nay.
      - twenty_local_storage:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty_db:
        condition: service_healthy
      twenty_redis:
        condition: service_healthy
    healthcheck:
      # curl co san trong image twentycrm/twenty; /healthz la endpoint upstream dung.
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Worker rieng cua Twenty: chay queue va cron (dong bo email/lich, viec nen).
  # Khong co worker thi moi thu phai email hay nhac lich deu khong bao gio chay.
  twenty_worker:
    image: twentycrm/twenty:latest
    container_name: esco_twenty_worker
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgresql://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD:?TWENTY_DB_PASSWORD must be set in .env}@twenty_db:5432/${TWENTY_DB_NAME:-twenty}
      SERVER_URL: http://localhost:${TWENTY_PORT:-3002}
      REDIS_URL: redis://twenty_redis:6379
      APP_SECRET: ${TWENTY_APP_SECRET:?TWENTY_APP_SECRET must be set in .env}
      STORAGE_TYPE: local
      # Server da chay migration va dang ky cron roi; worker lam lai se chay doi viec.
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - twenty_local_storage:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty_db:
        condition: service_healthy
      twenty_redis:
        condition: service_healthy
      twenty:
        condition: service_healthy

  # Redis cua rieng Twenty. KHONG mo cong ra host: khong stack nao khac dung no,
  # va Redis khong auth ma bind ra host thi ai trong mang LAN cung doc duoc CRM.
  twenty_redis:
    image: redis:7-alpine
    container_name: esco_twenty_redis
    restart: unless-stopped
    # noeviction: day la hang doi cong viec, khong phai cache. Redis tu xoa key khi
    # day bo nho thi job bien mat tham lang - loi kho truy nhat.
    command: ["--maxmemory-policy", "noeviction"]
    volumes:
      - twenty_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  twenty_db:
    image: postgres:16-alpine
    container_name: esco_twenty_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TWENTY_DB_NAME:-twenty}
      POSTGRES_USER: ${TWENTY_DB_USER:-twenty}
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD:?TWENTY_DB_PASSWORD must be set in .env}
    volumes:
      - twenty_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TWENTY_DB_USER:-twenty} -d ${TWENTY_DB_NAME:-twenty}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  hass_config:
  ninja_db_data:
  esco_grafana_data:
  twenty_data:
  twenty_local_storage:
  twenty_redis_data:
  connector_b_state:

networks:
  default:
    name: thermalbiz_lightweight
  # Mang dung chung voi stack ung dung, de connector_b noi duoc FastAPI (container
  # `thermal_api`). Stack ung dung phai chay truoc de tao mang nay.
  thermalbiz_shared:
    external: true
    name: thermalbiz_shared
