apiVersion: 1

# Mat khau duoc noi suy tu bien moi truong cua container Grafana
# (Grafana ho tro $ENV_VAR trong moi file provisioning).
# Cac bien nay duoc truyen vao qua docker compose.

datasources:
  # 1. ThingsBoard PostgreSQL Telemetry Datasource (HUONG A)
  - name: ThingsBoard_PostgreSQL
    type: postgres
    access: proxy
    url: tb_postgres:5432
    database: ${TB_DB_NAME}
    user: ${TB_DB_USER}
    secureJsonData:
      password: ${TB_DB_PASSWORD}
    jsonData:
      sslmode: 'disable'
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    isDefault: false

  # 2. ERPNext / Business MariaDB Datasource (HUONG A)
  - name: ERPNext_MariaDB
    type: mysql
    access: proxy
    url: erp_database:3306
    database: ${ERP_DB_NAME}
    user: ${ERP_DB_USER}
    secureJsonData:
      password: ${ERP_DB_PASSWORD}
    jsonData:
      maxOpenConns: 5
      maxIdleConns: 2
    isDefault: true

  # 3. Invoice Ninja Database Datasource (HUONG B)
  - name: InvoiceNinja_MySQL
    type: mysql
    access: proxy
    url: ninja_db:3306
    database: ${NINJA_DB_NAME}
    user: ${NINJA_DB_USER}
    secureJsonData:
      password: ${NINJA_DB_PASSWORD}
    jsonData:
      maxOpenConns: 5
      maxIdleConns: 2
    isDefault: false

  # 4. App tu viet - Postgres (trung tam cua he thong)
  - name: ThermalBiz_PostgreSQL
    type: postgres
    access: proxy
    url: db:5432
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: 'disable'
      maxOpenConns: 5
      maxIdleConns: 2
    isDefault: false
