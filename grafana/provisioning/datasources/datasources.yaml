apiVersion: 1

datasources:
  # 1. ThingsBoard PostgreSQL Telemetry Datasource
  - name: ThingsBoard_PostgreSQL
    type: postgres
    access: proxy
    url: tb_postgres:5432
    database: thingsboard
    user: tb_user
    secureJsonData:
      password: tb_password_2026
    jsonData:
      sslmode: 'disable'
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    isDefault: false

  # 2. ERPNext / Business MariaDB Datasource
  - name: ERPNext_MariaDB
    type: mysql
    access: proxy
    url: erp_database:3306
    database: erpnext_db
    user: erp_user
    secureJsonData:
      password: erp_password_2026
    jsonData:
      maxOpenConns: 5
      maxIdleConns: 2
    isDefault: true

  # 3. Invoice Ninja Database Datasource (Direction B)
  - name: InvoiceNinja_MySQL
    type: mysql
    access: proxy
    url: ninja_db:3306
    database: ninja
    user: ninja
    secureJsonData:
      password: ninja_pass_2026
    jsonData:
      maxOpenConns: 5
      maxIdleConns: 2
    isDefault: false
